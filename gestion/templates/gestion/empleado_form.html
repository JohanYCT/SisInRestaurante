{% extends 'gestion/base.html' %}

{% block content %}
<div class="form-container">
    <h2>{% if object %}Editar Empleado{% else %}Nuevo Empleado{% endif %}</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="flex items-center gap-3">
            <button type="submit" class="button button-primary">Guardar</button>
            <a class="button button-secondary" href="{% url 'empleados' %}">Cancelar</a>
        </div>
    </form>

    {% if object %}
        <p class="help-text">Deja la contraseña vacía si no deseas cambiarla.</p>
    {% endif %}
</div>
{% endblock %}
