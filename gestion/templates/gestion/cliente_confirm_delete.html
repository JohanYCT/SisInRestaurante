{% extends 'gestion/base.html' %}

{% block content %}
<div class="form-container">
    <h2>Eliminar Cliente</h2>
    <p>¿Estás seguro de que deseas eliminar al cliente <strong>{{ object.nombre }}</strong>?</p>
    <form method="post" class="mt-4 space-x-3">
        {% csrf_token %}
        <button type="submit" class="button button-danger">Eliminar</button>
        <a class="button button-secondary" href="{% url 'clientes' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
